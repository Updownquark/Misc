services:
  users-db: # Database where we'll store known users and barebones scenario information
    image: postgres:16
    container_name: ${USERS_DB_HOST}
    restart: always
    environment:
      POSTGRES_DB: ${USERS_DB}
      POSTGRES_USER: ${USERS_USERNAME}
      POSTGRES_PASSWORD: ${USERS_PASSWORD}
    volumes:
      - ${DEMO_DATA}/users_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  auth-db: # Database for KeyCloak's data
    image: postgres:16
    container_name: auth_db
    restart: always
    environment:
      POSTGRES_DB: ${KC_DB_NAME}
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - ${DEMO_DATA}/auth_db:/var/lib/postgresql/data
    networks:
      - auth_network

  auth: # KeyCloak OAUTH Server
    image: quay.io/keycloak/keycloak:latest
    container_name: auth_web
    restart: always
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth-db:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KC_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
    ports:
      - "8081:8080"
    depends_on:
      - auth-db
    networks:
      - auth_network

networks:
  auth_network:
